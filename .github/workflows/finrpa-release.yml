name: AgentPact synthetic release evidence

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  conformance:
    name: Ubuntu conformance / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and locked M5 tooling
        run: python -m pip install --disable-pip-version-check -e . -r requirements-m5-demo.lock
      - name: Run canonical conformance
        run: python scripts/finrpa_release.py conformance
      - name: Run deterministic recorded Agent evaluation
        if: matrix.python-version == '3.11'
        run: python scripts/agentpact_eval.py recorded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finrpa-conformance-${{ matrix.python-version }}
          path: artifacts/m5/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python-version == '3.11'
        with:
          name: agentpact-m12-recorded-eval
          path: artifacts/m12/*
          if-no-files-found: error

  synthetic-demo:
    name: Ubuntu synthetic governed browser proof
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and locked M5 tooling
        run: python -m pip install --disable-pip-version-check -e . -r requirements-m5-demo.lock
      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Resolve runner PostgreSQL binaries
        run: echo "FINRPA_POSTGRES_BIN=$(pg_config --bindir)" >> "$GITHUB_ENV"
      - name: Run canonical synthetic demo
        run: python scripts/finrpa_release.py demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finrpa-synthetic-demo
          path: artifacts/m5/*
          if-no-files-found: error

  windows-release-smoke:
    name: Windows manual/release smoke
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and locked M5 tooling
        run: python -m pip install --disable-pip-version-check -e . -r requirements-m5-demo.lock
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Run canonical conformance smoke
        run: python scripts/finrpa_release.py conformance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finrpa-windows-release-smoke
          path: artifacts/m5/*
          if-no-files-found: error
